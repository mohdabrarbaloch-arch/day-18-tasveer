[project]
name = "tasveer"
version = "1.0.0"
description = "A Midjourney-style image generation platform — prompt in, a grid of pictures out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ABraz Baloch" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "email-validator>=2.0",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.0.1",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "pillow>=10.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
